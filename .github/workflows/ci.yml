name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

# AbleOps SDK(github.com/heartblast/ableops-sdk)는 비공개 저장소다. 공개 모듈 프록시가
# 받아올 수 없으므로 GOPRIVATE 로 직접 조회 경로를 쓰고, 아래 단계에서 자격증명을 건다.
env:
  GOPRIVATE: github.com/heartblast/*

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      # ⚠ ABLEOPS_SDK_TOKEN 은 ableops-sdk 읽기 권한이 있는 토큰이어야 한다
      #   (기본 GITHUB_TOKEN 은 다른 저장소에 접근하지 못한다).
      - name: Configure private AbleOps SDK module access
        shell: bash
        env:
          SDK_TOKEN: ${{ secrets.ABLEOPS_SDK_TOKEN }}
        run: git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/heartblast/".insteadOf "https://github.com/heartblast/"
      - run: go mod verify
      - name: Test, vet and build
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build deployment files with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build deployment files with Bash
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build.sh
      # Managed Extension 패키지(*.ableops-ext) 검증은 대표 환경 하나에서만 한다.
      # Linux 에서 linux/amd64·windows/amd64 를 CGO_ENABLED=0 으로 크로스 컴파일하므로
      # Windows runner 에서 같은 패키지를 다시 만들 이유가 없다(스크립트 자체가 패키지를 검증한다).
      - name: Build and verify Managed Extension package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-extension.sh
      - name: Check authentication and concurrency races
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/ableops ./internal/tools ./internal/config ./internal/localauth ./internal/webdelegation ./internal/mcpserver ./internal/openapi ./internal/dynamic ./internal/app ./internal/extension ./cmd/ableops-mcp-auth
