name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # PowerShell 스크립트는 UTF-8 BOM 으로 저장해야 한다. Windows PowerShell 5.1 은 BOM 이 없는
      # .ps1 을 시스템 ANSI 코드페이지(예: cp949)로 읽으므로, 한글 주석·문자열이 깨지면서
      # 구문 오류로 스크립트가 아예 실행되지 않는다. 편집기 쪽 규칙은 .editorconfig 에 있다.
      - name: Check PowerShell scripts are saved as UTF-8 with BOM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          while IFS= read -r f; do
            # ⚠ CR 을 먼저 버린다. .ps1 은 .gitattributes 때문에 CRLF 로 체크아웃되고, Linux 의
            #   grep 은 줄 내용 끝에 남은 \r 까지 본다. 그 \r 이 아래 패턴에 매치되므로, CR 을
            #   지우지 않으면 **모든** .ps1 이 "비ASCII 있음" 으로 판정되어 순수 ASCII 파일까지
            #   BOM 을 요구하게 된다(의도는 한글 등이 든 파일만 검사하는 것이다).
            tr -d '\r' < "$f" | LC_ALL=C grep -q $'[^ -~\t]' || continue
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' ')" != "efbbbf" ]; then
              echo "::error file=$f::비ASCII 문자가 있는 PowerShell 스크립트에 UTF-8 BOM 이 없습니다."
              status=1
            fi
          done < <(git ls-files '*.ps1')
          exit $status
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - name: Test, vet and build
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build deployment files with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build deployment files with Bash
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build.sh
      # Managed Extension 패키지(*.ableops-ext) 검증은 대표 환경 하나에서만 한다.
      # Linux 에서 linux/amd64·windows/amd64 를 CGO_ENABLED=0 으로 크로스 컴파일하므로
      # Windows runner 에서 같은 패키지를 다시 만들 이유가 없다(스크립트 자체가 패키지를 검증한다).
      - name: Build and verify Managed Extension package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-extension.sh
      - name: Check authentication and concurrency races
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/ableops ./internal/tools ./internal/config ./internal/localauth ./internal/webdelegation ./internal/mcpserver ./internal/openapi ./internal/dynamic ./internal/app ./internal/extension ./cmd/ableops-mcp-auth
      # 의존성 취약점 점검은 대표 환경 하나에서만 한다. 취약점 DB 는 플랫폼별 정보를 함께 담으므로
      # (예: windows 전용 항목) Linux 에서 돌려도 다른 OS 대상 항목까지 보고된다.
      #
      # ⚠ 실패하면 빌드를 멈춘다. 경고로만 남기면 아무도 보지 않는다. 호출 경로가 없는 항목까지
      # 막혀 불편하면 그때 -show 로 범위를 좁히되, 기본은 "막는다"로 둔다.
      - name: Scan dependencies for known vulnerabilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
