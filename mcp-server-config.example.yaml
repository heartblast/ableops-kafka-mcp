# 공개 예제입니다. 환경에 맞게 복사·수정한 뒤 --config로 명시합니다.
# 실제 토큰·비밀번호·Authorization 헤더는 넣지 않습니다.
version: 1
server:
  transport: http
  # 로컬 HTTP는 loopback IP만 허용합니다.
  http_address: '127.0.0.1:8081'
  # 브라우저에서 사용할 경우 정확한 Origin을 지정합니다.
  allowed_origins: []
backend:
  # /api를 제외한 Backend origin입니다.
  base_url: 'https://ableops.example.com'
  # 로컬 http://localhost:8080을 사용할 때만 true로 변경합니다.
  allow_http: false
  # 한 도구 전체와 개별 REST 요청의 제한입니다.
  request_timeout: '15s'
  # 선택 PEM CA 파일. 상대 경로는 YAML 파일 위치 기준입니다.
  ca_file: ''
auth:
  # 기존 사용자별 인증 저장소입니다. 이 파일이 자동 생성되지는 않습니다.
  # Windows 예: '${LOCALAPPDATA}/AbleOpsKafkaMCP/local.auth-store.json'
  store_file: '.secrets/local.auth-store.json'
  # stdio와 enroll에서 읽는 환경변수 이름입니다. HTTP 서버는 읽지 않습니다.
  token_env: 'ABLEOPS_API_TOKEN'
logging:
  level: info
message_sample:
  # 메시지 본문·키·헤더는 활성화해도 공개하지 않습니다. 위치 메타데이터만 전달합니다.
  enabled: false
  # 정확한 클러스터/토픽 조합만 허용하며 와일드카드를 지원하지 않습니다.
  # 예: ['synthetic-dev/orders']
  allowed_topics: []
# OpenAPI 기반 Dynamic 도구(선택). 기본 false이며 true일 때만 /openapi.json을 읽고 주기적으로 갱신합니다.
dynamic_tools:
  enabled: false
  # 생략하면 1차 파일럿 5개를 선택하지만, 노출 안전 게이트가 SAFE로 분류한 것만 추가됩니다
  # (파일럿 5개는 모두 비노출). Static 도구와 이름이 같은 것은 등록되지 않습니다.
  # operations: ['getTopicPartitions', 'getEventSummary', 'getBranding']
  # 계약 변경 확인 주기입니다. 기본 5m, 허용 1m~24h.
  # refresh_interval: '5m'
# AbleOps Web/Chat Backend 전용 단기 위임(선택). 기본 false입니다.
# true로 켜면 POST /internal/delegations 가 열립니다 — loopback 서버간 전용이며 브라우저는
# 직접 호출할 수 없습니다. 공유 비밀은 YAML이 아니라 환경변수로만 주입합니다(32바이트 이상).
web_delegation:
  enabled: false
  # 위임 수명입니다. 기본 10m, 허용 1m~30m.
  # ttl: '10m'
  # 공유 비밀을 읽을 환경변수 이름입니다. 생략하면 ABLEOPS_WEB_DELEGATION_SECRET 입니다.
  # secret_env: 'ABLEOPS_WEB_DELEGATION_SECRET'
